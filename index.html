<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPJ — trening do kolokwium</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><strong>PPJ</strong><div><h1>Trening do kolokwium</h1><small>Java · podstawy · warunki · pętle · tablice</small></div><button type="button" id="theme-toggle">☾ Ciemny motyw</button></div></header><main class="wrap">
<section class="panel" id="settings"><h2>Ustawienia quizu</h2><div class="controls"><div><label class="formlabel" for="bank">Baza pytań</label><select id="bank"><option value="canonical">Tylko kanoniczne (ze screenów)</option><option value="extra">Tylko moje dodatkowe</option><option value="all" selected>Wszystkie pytania</option></select></div><div><label class="formlabel" for="category">Zakres</label><select id="category"><option value="all">Wszystkie działy</option><option>Podstawy i operatory</option><option>Warunki, pętle i algorytmy</option><option>Tablice jednowymiarowe</option></select></div><div><label class="formlabel" for="count">Liczba pytań</label><select id="count"><option value="all">Wszystkie dostępne</option><option value="10">10 losowych</option><option value="20">20 losowych</option><option value="30">30 losowych</option><option value="40">40 losowych</option></select></div></div><div class="buttons"><label class="check"><input type="checkbox" id="shuffle" checked> Losowa kolejność</label><label class="check"><input type="checkbox" id="immediate"> Sprawdzaj od razu</label></div><div class="buttons"><button class="primary" id="start">Rozpocznij nowy test</button><button id="resume" class="hidden">Wznów zapisany test</button><button id="clear">Wyczyść zapisany postęp</button></div><p class="hint" id="dbsummary"></p></section>
<section id="quiz" class="hidden"><div class="navline"><span id="counter"></span><button id="backsettings">Ustawienia / nowy test</button></div><div class="progress"><div id="bar"></div></div><div class="question" id="question" style="margin-top:16px"></div></section>
<section class="result hidden" id="result"></section></main><footer>PPJ · GitHub Pages · Postęp zapisywany lokalnie w przeglądarce</footer>
<script src="questions.js" defer></script>
<script src="app.js" defer></script></body></html>
