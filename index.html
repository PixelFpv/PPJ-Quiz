<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19392e">
  <meta name="description" content="PPJ Java practice quiz. Review canonical and additional questions for your exam.">
  <title>PPJ Quiz — Java Exam Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap header-inner">
    <strong class="brand">PPJ</strong>
    <div class="header-title"><h1>Java Exam Practice</h1><small>Basics · Operators · Conditions · Loops · Arrays</small></div>
    <button type="button" id="theme-toggle" aria-label="Switch theme">☾ Dark mode</button>
  </div>
</header>
<main class="wrap">
  <section class="panel" id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Quiz settings</h2>
    <div class="controls">
      <div><label class="formlabel" for="bank">Question bank</label><select id="bank">
        <option value="canonical">Canonical questions (screenshots only)</option>
        <option value="extra">Additional practice questions</option>
        <option value="all" selected>All questions</option>
      </select></div>
      <div><label class="formlabel" for="category">Topic</label><select id="category">
        <option value="all">All topics</option>
        <option value="Podstawy i operatory">Basics and operators</option>
        <option value="Warunki, pętle i algorytmy">Conditions, loops and algorithms</option>
        <option value="Tablice jednowymiarowe">One-dimensional arrays</option>
      </select></div>
      <div><label class="formlabel" for="count">Number of questions</label><select id="count">
        <option value="all">All available</option>
        <option value="10">10 random questions</option><option value="20">20 random questions</option>
        <option value="30">30 random questions</option><option value="40">40 random questions</option>
      </select></div>
    </div>
    <div class="buttons toggles">
      <label class="check"><input type="checkbox" id="shuffle" checked> Shuffle questions</label>
      <label class="check"><input type="checkbox" id="immediate"> Check each answer immediately</label>
    </div>
    <div class="buttons actions">
      <button class="primary" id="start">Start new quiz</button>
      <button id="resume" class="hidden">Resume saved quiz</button>
      <button id="clear">Clear saved progress</button>
    </div>
    <p class="hint" id="dbsummary" aria-live="polite"></p>
  </section>
  <section id="quiz" class="hidden" aria-label="Quiz">
    <div class="navline"><span id="counter" aria-live="polite"></span><button id="backsettings">Settings / new quiz</button></div>
    <div class="progress" role="progressbar" aria-label="Answers completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
    <div class="question" id="question"></div>
  </section>
  <section class="result hidden" id="result" aria-live="polite"></section>
</main>
<footer>PPJ · GitHub Pages · Progress is saved in your browser</footer>
<script src="questions.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
